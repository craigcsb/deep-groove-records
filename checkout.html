<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Deep Groove Records</title>
  <link rel="stylesheet" href="css/modernist.css" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- =========================================================
       ADOBE WEB SDK EMBED CODE — paste on every page (see index.html)
  ========================================================== -->
  <!-- Command queue stub: makes window.alloy available synchronously so
       calls made before the async library below finishes loading are
       queued (as pending promises) instead of silently dropped. -->
  <script>
    !function(n,o){o.forEach(function(o){n[o]||((n.__alloyNS=n.__alloyNS||[]).push(o),n[o]=
    function(){var u=arguments;return new Promise(function(i,l){n[o].q.push([i,l,u])})},n[o].q=[])})}
    (window,["alloy"]);
  </script>
  <script src="https://assets.adobedtm.com/2d725b839720/1fb6fd223988/launch-89c903526a64.min.js" async></script>

</head>
<body>

  <nav class="nav site-nav">
    <a class="nav-brand" href="index.html">
      <svg class="brand-mark" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="10" cy="10" r="8.3" fill="none" stroke="currentColor" stroke-width="1.3" />
        <circle cx="10" cy="10" r="8.3" fill="none" stroke="var(--color-accent)" stroke-width="1.3" stroke-dasharray="1.4 3.2" />
        <circle cx="10" cy="10" r="1.7" fill="var(--color-accent)" />
      </svg>
      Deep Groove Records
    </a>
    <a href="index.html">Home</a>
    <a href="products.html">Shop</a>
    <a class="btn btn-secondary btn-icon" href="call-center-mock.html" aria-label="Call centre mock (demo tool)" title="Call centre mock (demo tool)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </a>
    <button type="button" class="btn btn-secondary auth-btn" data-auth-trigger>Sign In</button>
    <button type="button" class="btn btn-secondary btn-icon cart-btn" onclick="location.href='cart.html'" aria-label="Cart">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      <span class="cart-count" data-cart-badge>0</span>
    </button>
  </nav>

  <main class="page-wrap" id="checkout-root"></main>

  <footer class="site-footer">
    Deep Groove Records — a learning site for Adobe Customer Journey Analytics / AJO. Not a real store.
  </footer>

  <script src="js/consent.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/site.js"></script>
  <script>
    const root = document.getElementById("checkout-root");
    const cart = getCart();

    function renderCheckoutForm() {
      root.innerHTML = `
        <div class="section-head"><h2>Checkout</h2></div>
        <table class="table cart-table">
          <thead><tr><th>Item</th><th>Qty</th><th>Subtotal</th></tr></thead>
          <tbody>
            ${cart.map(function (item) {
              return `<tr><td class="item-name">${item.name}</td><td>${item.qty}</td><td>${formatPrice(item.price * item.qty)}</td></tr>`;
            }).join("")}
          </tbody>
        </table>
        <div class="cart-summary">
          <span class="total">Total: ${formatPrice(cartTotal(cart))}</span>
        </div>
        <p class="checkout-note">
          This is a mock checkout — no payment is processed. Email is optional and only
          used here to illustrate sending an authenticated identity alongside the ECID
          (see the site README for how to wire that into the Web SDK identityMap).
        </p>
        <form id="checkout-form" class="checkout-form">
          <div class="field">
            <label for="email">Email (optional)</label>
            <input class="input" type="email" id="email" placeholder="you@example.com" />
          </div>
          <button class="btn btn-primary" type="submit">Place order</button>
        </form>
      `;

      document.getElementById("checkout-form").addEventListener("submit", function (e) {
        e.preventDefault();
        completeOrder(document.getElementById("email").value);
      });

      trackPageView();
      trackCheckoutStart(cart);
    }

    function completeOrder(email) {
      const order = {
        purchaseID: "ORD-" + Date.now(),
        priceTotal: +cartTotal(cart).toFixed(2)
      };

      trackPurchase(order, cart, email);

      root.innerHTML = `
        <div class="confirmation">
          <div class="check">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          </div>
          <h1>Thanks for your order!</h1>
          <p>Order ID</p>
          <div class="order-id">${order.purchaseID}</div>
          <p>Total charged: <strong>${formatPrice(order.priceTotal)}</strong></p>
          <p><a class="btn btn-primary" href="products.html">Continue shopping</a></p>
        </div>
      `;

      clearCart();
    }

    if (cart.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <h2>Nothing to check out</h2>
          <p>Your cart is empty.</p>
          <a class="btn btn-primary" href="products.html">Shop all records</a>
        </div>
      `;
      trackPageView();
    } else {
      renderCheckoutForm();
    }
  </script>
</body>
</html>
